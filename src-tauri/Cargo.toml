[package]
name = "prabhupadaconnectv3"
version = "0.2.0"
description = "Prabhupada Connect v3 - scripture study desktop app"
edition = "2021"
rust-version = "1.80"

[lib]
name = "prabhupadaconnectv3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-full", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
regex = "1"
fancy-regex = "0.13"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true
